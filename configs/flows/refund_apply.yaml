id: refund_apply
version: 1
name: 退款申请
description: 用户明确要求办理退款申请。收集后只引导到业务页面；咨询退款政策或条件时走知识问答。

steps:
  - id: start
    type: entry
    next: collect_order

  - id: collect_order
    type: collect
    any_of: [order_number, order_id]
    prompt: 请选择要申请退款的订单，也可以手动输入订单号。
    next: check_order_status

  - id: check_order_status
    type: guard
    check: order_status
    reject_when:
      equals: cancelled
    retry: collect_order
    prompt: 该订单已取消，不能通过客服申请退款。请重新选择订单，或输入其他订单号。
    next: collect_refund_reason

  - id: collect_refund_reason
    type: collect
    slot: refund_reason
    prompt: 请告诉我申请退款的原因。
    next: collect_refund_type

  - id: collect_refund_type
    type: collect
    slot: refund_type
    prompt: 请用自己的话描述这次退款的类型，不限固定选项。
    next: collect_refund_amount

  - id: collect_refund_amount
    type: collect
    slot: refund_amount
    prompt: 请告诉我你希望申请的退款金额。
    next: handoff

  - id: handoff
    type: handoff
    target: refund_service
    next: end

  - id: end
    type: end
